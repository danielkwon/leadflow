[project]
name = "leadflow-common"
version = "0.1.0"
description = "LeadFlow B2B 영업 자동화 공통 라이브러리 - DB, 스크래퍼, 이메일, 캠페인, CRM"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "boto3>=1.34",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "gspread>=6.0",
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
    "openai>=1.30",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
