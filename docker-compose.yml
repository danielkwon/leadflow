services:
  # 1. LeadFlow FastAPI Web Dashboard
  leadflow-web:
    build:
      context: .
      dockerfile: ./leadflow/Dockerfile
    container_name: leadflow-web
    restart: unless-stopped
    command: ["web", "--host", "0.0.0.0", "--port", "8080"]
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./leadflow_common/config:/app/config
    networks:
      - leadflow-net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.leadflow.entrypoints=websecure"
      - "traefik.http.routers.leadflow.rule=Host(`leadflow.nanoplanc.com`)"
      - "traefik.http.routers.leadflow.tls.certresolver=leresolver"
      - "traefik.http.services.leadflow.loadbalancer.server.port=8080"

  # 2. Drip Campaign Scheduler Daemon
  leadflow-scheduler:
    build:
      context: .
      dockerfile: ./sales_pipeline/Dockerfile
    container_name: leadflow-scheduler
    restart: unless-stopped
    command: ["scheduler"]
    env_file:
      - .env
    environment:
      - APP_ENV=production
    volumes:
      - ./data:/app/data
      - ./leadflow_common/config:/app/config
    networks:
      - leadflow-net
    depends_on:
      - leadflow-web

  # 3. Gmail Inbox Watcher Monitor Daemon
  leadflow-monitor:
    build:
      context: .
      dockerfile: ./sales_pipeline/Dockerfile
    container_name: leadflow-monitor
    restart: unless-stopped
    command: ["monitor"]
    env_file:
      - .env
    environment:
      - APP_ENV=production
    volumes:
      - ./data:/app/data
      - ./leadflow_common/config:/app/config
    networks:
      - leadflow-net
    depends_on:
      - leadflow-web

networks:
  leadflow-net:
    name: leadflow-net
    driver: bridge
  proxy:
    name: proxy
    external: true
