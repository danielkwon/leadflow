# 스크래핑 대상 설정
# sales scrape 명령어에서 이 파일을 참조하여 일괄 실행할 수 있다.

regions:
  - 서울
  - 경기
  - 인천
  - 부산
  - 대구
  - 대전
  - 광주
  - 울산
  - 세종
  - 강원
  - 충북
  - 충남
  - 전북
  - 전남
  - 경북
  - 경남
  - 제주

keywords:
  - 인력사무소
  - 건설사
  - 전문건설업체
  - 시공사
  - 건설인력
  - 노무관리
  - 인력파견

# 네이버 API 설정
scraping:
  max_results_per_query: 100  # 키워드+지역 조합당 최대 수집 수
  delay_seconds: 0.5          # API 호출 간 딜레이
  enrich_delay_min: 1.0       # 웹사이트 스크래핑 최소 딜레이
  enrich_delay_max: 3.0       # 웹사이트 스크래핑 최대 딜레이
