{% extends "base.html" %}

{% block title %}회원가입 - LeadFlow B2B 영업 자동화 플랫폼{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-header">
    <div class="brand-icon auth-logo">LF</div>
    <h1 class="auth-title">LeadFlow 회원가입</h1>
    <p class="auth-subtitle">안전하게 격리된 영업 데이터와 자동화 캠페인을 시작하세요</p>
  </div>

  {% if error %}
  <div class="alert alert-error">
    {{ error }}
  </div>
  {% endif %}

  <form action="/signup" method="post">
    <div class="form-group">
      <label for="email" class="form-label">이메일 주소</label>
      <input type="email" id="email" name="email" class="form-input" placeholder="name@company.com" required autocomplete="username">
    </div>

    <div class="form-group">
      <label for="company_name" class="form-label">회사명 / 사이트명 (선택)</label>
      <input type="text" id="company_name" name="company_name" class="form-input" placeholder="예: (주)리드플로우테크">
    </div>

    <div class="form-group">
      <label for="password" class="form-label">비밀번호</label>
      <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; height: 48px;">
      <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
      <span>계정 생성하기</span>
    </button>
  </form>

  <div class="auth-footer">
    <span>이미 계정이 있으신가요?</span>
    <a href="/login">로그인하기</a>
  </div>
</div>
{% endblock %}
