{% extends "base.html" %}

{% block title %}로그인 - LeadFlow B2B 영업 자동화 플랫폼{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-header">
    <div class="brand-icon auth-logo">LF</div>
    <h1 class="auth-title">LeadFlow 시작하기</h1>
    <p class="auth-subtitle">B2B 리드 수집 및 영업 자동화 파이프라인 플랫폼</p>
  </div>

  {% if info_msg %}
  <div class="alert alert-success">
    {{ info_msg }}
  </div>
  {% endif %}

  {% if error %}
  <div class="alert alert-error">
    {{ error }}
  </div>
  {% endif %}

  <form action="/login" method="post">
    <div class="form-group">
      <label for="email" class="form-label">이메일 주소</label>
      <input type="email" id="email" name="email" class="form-input" placeholder="name@company.com" required autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password" class="form-label">비밀번호</label>
      <div style="position: relative;">
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 44px;">
        <button type="button" id="toggle-password" class="password-toggle" title="비밀번호 보기" tabindex="-1">
          <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
        </button>
      </div>
    </div>

    <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: -4px;">
      <input type="checkbox" id="remember_me" name="remember_me" value="1" style="width: 16px; height: 16px; accent-color: var(--primary, #4f46e5);">
      <label for="remember_me" class="form-label" style="margin: 0; cursor: pointer; font-size: 0.875rem; color: var(--text-secondary, #6b7280);">자동 로그인 (30일 유지)</label>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; height: 48px;">
      <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
      <span>로그인</span>
    </button>
  </form>

  <div class="auth-footer">
    <span>계정이 없으신가요?</span>
    <a href="/signup">회원가입하기</a>
  </div>
</div>

<style>
.password-toggle {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: #9ca3af;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  transition: color 0.15s;
}
.password-toggle:hover {
  color: #4f46e5;
}
</style>

<script>
(function() {
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');
  let visible = false;

  toggleBtn.addEventListener('click', function() {
    visible = !visible;
    passwordInput.type = visible ? 'text' : 'password';
    var icon = toggleBtn.querySelector('[data-lucide]');
    if (icon) {
      icon.setAttribute('data-lucide', visible ? 'eye-off' : 'eye');
      if (window.lucide) lucide.createIcons();
    }
  });
})();
</script>
{% endblock %}
